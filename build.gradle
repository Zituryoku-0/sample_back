plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.7'
	id 'io.spring.dependency-management' version '1.1.7'
    id "org.openapi.generator" version "7.17.0"
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'バックエンド用'

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'io.swagger.core.v3:swagger-annotations:2.2.8'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:3.0.3'
    testImplementation 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.5'
    implementation "org.openapitools:jackson-databind-nullable:0.2.6"
    testImplementation "org.springframework.boot:spring-boot-starter-jdbc"
}

def openApiSpecFile = file("${projectDir}/openapi/openapi.yaml")
def openApiOutputDirectory = file("${layout.buildDirectory.get()}/generated/openapi")
def openApiGeneratedJavaDirectory =
        file("${openApiOutputDirectory}/src/main/java")

openApiGenerate {
    generatorName = 'spring'

    inputSpec = openApiSpecFile.absolutePath
    outputDir = openApiOutputDirectory.absolutePath

    apiPackage = 'com.example.sample.generated.api'
    modelPackage = 'com.example.sample.generated.model'
    invokerPackage = 'com.example.sample.generated.invoker'

    generateApiTests = false
    generateModelTests = false
    generateApiDocumentation = false
    generateModelDocumentation = false

    configOptions = [
            library                : 'spring-boot',

            // Controllerクラスではなく、APIインターフェースを生成する
            interfaceOnly          : 'true',

            // Spring Boot 3のJakarta名前空間を使用する
            useSpringBoot3         : 'true',

            // OpenAPIのtagsをAPIクラスの単位として使用する
            useTags                : 'true',

            // APIインターフェースにデフォルト実装を生成しない
            skipDefaultInterface   : 'true',

            // JsonNullableを使用しない
            openApiNullable        : 'false',

            // Swaggerアノテーションを生成しない
            annotationLibrary      : 'none',

            // SpringDoc関連のドキュメントコードを生成しない
            documentationProvider : 'none',

            // ResponseEntity<T>を戻り値に使用する
            useResponseEntity      : 'true',

            // Jakarta Bean Validationを使用する
            useBeanValidation      : 'true',

            // 生成日時による不要な差分を防ぐ
            hideGenerationTimestamp: 'true',

            // LocalDateなどのjava.time APIを使用する
            dateLibrary            : 'java8'
    ]
}

// OpenAPI Generatorの生成コードをJavaのコンパイル対象に追加する
sourceSets {
    main {
        java {
            srcDir openApiGeneratedJavaDirectory
        }
    }
}

// compileJava実行前にOpenAPIコードを生成する
tasks.named('compileJava') {
    dependsOn tasks.named('openApiGenerate')
}

// 入出力をGradleに認識させ、不要な再生成を抑制する
tasks.named('openApiGenerate') {
    inputs.file(openApiSpecFile)
    outputs.dir(openApiOutputDirectory)

    // タグ変更などでAPIクラス構成が変わった際に、古い生成物（例: 不要なDefaultApi.java）が
    // 残り続けるのを防ぐため、生成前に出力先を削除する
    doFirst {
        delete openApiOutputDirectory
    }
}

// JUnit Platformを使用する
tasks.named('test') {
    useJUnitPlatform()
}
